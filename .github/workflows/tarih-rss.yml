name: Günlük Tarihte Bugün RSS

on:
  schedule:
    - cron: "17 3 * * *"    # 06:17 (TSİ) – ana çalışma
    - cron: "47 11 * * *"   # 14:47 (TSİ) – sabah alınanları denetler; yalnızca eksikleri ekler/tamamlar, tamamsa hiçbir şey değişmez
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (boş = Türkiye saatiyle bugün)"
        required: false
      count:
        description: "Günlük makale üst sınırı (boş = sınırsız: güne ait tüm uygun içerik)"
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: tarih-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: https://xmifrmx.github.io/makale/
      WIKI_CONTACT: https://github.com/xmifrmx/makale
      ARTICLES_PER_DAY: "0"      # 0 = sınırsız
      MAX_BODY_CHARS: "0"        # 0 = karakter sınırı yok, maddenin tamamı
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s tests

      - name: RSS ve makaleleri üret
        id: gen
        env:
          IN_DATE: ${{ inputs.date }}
          IN_COUNT: ${{ inputs.count }}
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_COUNT" ] && args+=(--count "$IN_COUNT")
          python -m tarihrss "${args[@]}"

      - name: Değişiklikleri depoya yaz
        if: ${{ always() && steps.gen.conclusion != 'skipped' }}
        run: |
          git config user.name "tarih-rss-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml feed sitemap.xml makale data assets
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Tarihte Bugün: $(TZ=Europe/Istanbul date +%F) otomatik güncelleme"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: GitHub Pages derlemesini tetikle
        if: ${{ always() && steps.gen.conclusion != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
